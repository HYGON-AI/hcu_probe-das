[project]
name = "hcu-probe"
version = "26.2.0+hcu.0.2.0"
requires-python = ">=3.8,<3.15"
description = "HYGON HCU distribution of mindstudio-probe training precision debugger, with multi-framework integration layer"
license = "MulanPSL-2.0"
readme = "README.md"
authors = [
    {name = "HYGON DAS Team"},
]
keywords = ["pytorch", "probe", "hcu", "precision", "megatron"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "wheel",
    "einops",
    "numpy>=1.23.0",
    "pandas>=1.3.5",
    "pyyaml",
    "tqdm",
    "openpyxl>=3.0.6",
    "matplotlib",
    "tensorboard>=2.11.2",
    "skl2onnx>=1.14.1",
    "packaging",
    "pytz",
    "psutil",
]

[project.scripts]
hcuprobe = "hcuprobe.hcuprobe:main"

[project.urls]
Homepage = "https://github.com/HYGON-AI/hcu_probe-das"

[project.optional-dependencies]
test = [
    "h5py",
    "mindspore",
    "onnxruntime",
    "protobuf",
    "pytest-cov",
    "pytest>=8.0",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/hcuprobe"]

[tool.hatch.build]
artifacts = [
    "python/hcuprobe/lib/**",
    "python/hcuprobe/scripts/**",
    "python/hcuprobe/vendors/**",
    "python/hierarchy_plugin/server/**/*.html",
    "python/hierarchy_plugin/server/**/*.js",
    "python/trend_analyzer/server/**/*.html",
    "python/trend_analyzer/server/**/*.js",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
