name: CI

on:
  pull_request_target:
    branches:
      - 26.2.0-dev
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  # Runs caused by unrelated labels use their own group so they cannot cancel
  # an approved HCU run for the same pull request.
  group: hcu-probe-ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'hcu-ci-approved') && github.run_id || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python syntax and style
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'hcu-ci-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # The HCU gate below limits privileged fork execution; this hosted
          # job only compiles and lints source without retaining credentials.
          allow-unsafe-pr-checkout: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.14.14

      - name: Check Python syntax
        run: python -m compileall -q python test

      - name: Check Python code
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            base_remote_ref="refs/remotes/ci-base/${BASE_REF}"
            git fetch --no-tags --force \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
              "+refs/heads/${BASE_REF}:${base_remote_ref}"
            if ! diff_base=$(git merge-base "${HEAD_SHA}" "${BASE_SHA}"); then
              echo "ERROR: unable to determine the PR merge base." >&2
              exit 1
            fi
          else
            diff_base="${BASE_SHA}"
            if [[ -z "${diff_base}" || "${diff_base}" =~ ^0+$ ]]; then
              diff_base="${HEAD_SHA}^"
            fi
          fi

          changed_python_file=$(mktemp)
          trap 'rm -f -- "${changed_python_file}"' EXIT
          if ! git diff --name-only --diff-filter=ACMR -z \
            "${diff_base}" "${HEAD_SHA}" -- 'python/**/*.py' > "${changed_python_file}"; then
            echo "ERROR: unable to list changed Python files." >&2
            exit 1
          fi
          mapfile -d '' changed_python < "${changed_python_file}"

          if (( ${#changed_python[@]} == 0 )); then
            echo "No changed production Python files to lint."
            exit 0
          fi
          printf 'Checking %s\n' "${changed_python[@]}"
          ruff check --config pre-commit/pyproject.toml "${changed_python[@]}"
          ruff format --check --config pre-commit/pyproject.toml "${changed_python[@]}"

  build-wheel:
    name: Build wheel (DTK ${{ matrix.dtk_version }})
    # PR code can reach ARC runners only when a maintainer applies this label.
    # A later push needs the label to be removed and applied again.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action == 'labeled' && github.event.label.name == 'hcu-ci-approved')
    runs-on: hygon-build
    timeout-minutes: 30
    container:
      image: ${{ format('{0}/hcu/base/dtk:{1}', vars.HARBOR_SITE, matrix.image_tag) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - dtk_id: dtk2604
            dtk_version: 2604
            python_version: "3.10"
            image_tag: 26.04-rockylinux8.6-py3.10
            pytorch_index_suffix: nightly/dtk2604/+simple/
            pytorch_das_spec: torch==2.11.0
            torch_version: 2.11.0
          - dtk_id: dtk2610
            dtk_version: 2610
            python_version: "3.12"
            image_tag: 26.10-rockylinux8.6-py3.12
            pytorch_index_suffix: nightly/dtk2610/+simple/
            pytorch_das_spec: torch==2.13.0
            torch_version: 2.13.0
          - dtk_id: dtk2704
            dtk_version: 2704
            python_version: "3.12"
            image_tag: 27.04-rockylinux8.6-py3.12
            pytorch_index_suffix: nightly/dtk2704
            pytorch_das_spec: torch==2.13.0
            torch_version: 2.13.0
    env:
      BUILD_RUN_ROOT: /ci_public/hcu_probe-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/build/${{ matrix.dtk_id }}
      PYTHON_BIN: python${{ matrix.python_version }}
      CI_TORCH_VERSION: ${{ matrix.torch_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Build and repair manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${BUILD_RUN_ROOT}"
          mkdir -p "${BUILD_RUN_ROOT}/dist" "${BUILD_RUN_ROOT}/output"
          "${PYTHON_BIN}" -m pip install --disable-pip-version-check build
          (
            cd /tmp
            "${PYTHON_BIN}" -m build --wheel \
              --outdir "${BUILD_RUN_ROOT}/dist" "${GITHUB_WORKSPACE}"
          )

          set +u
          source /opt/dtk/env.sh
          set -u
          "${PYTHON_BIN}" -m pip install --disable-pip-version-check --no-cache-dir CIUpload
          dtk_version="$(tr -d '.[:space:]' < /opt/dtk/.info/rocm_version)"
          # Shared exclusions: these runtime libraries are provided by DTK or
          # pytorch-das and must not be bundled into either manylinux wheel.
          excludes=(
            --exclude "libgalaxyhip.so*"
            --exclude "libMIOpen.so*"
            --exclude "librccl.so*"
            --exclude "libhipblas.so*"
            --exclude "libhipfft.so*"
            --exclude "libhiprand.so*"
            --exclude "libhipsolver.so*"
            --exclude "libhipsparse.so*"
            --exclude "libhipnn.so*"
            --exclude "librocblas.so*"
            --exclude "librocfft.so*"
            --exclude "librocrand.so*"
            --exclude "librocsparse.so*"
            --exclude "librocm_smi64.so*"
            --exclude "librocfft-device-*.so*"
            --exclude "libc10.so*"
            --exclude "libc10_hip.so*"
            --exclude "libtorch_cpu.so*"
            --exclude "libtorch_hip.so*"
            --exclude "libtorch_python.so*"
            --exclude "libtorch.so*"
            --exclude "libtorchaudio*"
            --exclude "_torchaudio*"
            --exclude "libavcodec*"
            --exclude "libavdevice*"
            --exclude "libavfilter*"
            --exclude "libavformat*"
            --exclude "libavutil*"
            --exclude "libsox*"
            --exclude "libnibplast.so*"
            --exclude "libnuma.so*"
          )
          CIUpload REPAIR \
            "${excludes[@]}" \
            --dtk_version "${dtk_version}" \
            --torch_version "${CI_TORCH_VERSION}" \
            --git_commit "${GITHUB_SHA:0:6}" \
            --outputdir "${BUILD_RUN_ROOT}/output" \
            -f "${BUILD_RUN_ROOT}"/dist/*.whl
          shopt -s nullglob
          repaired_wheels=("${BUILD_RUN_ROOT}"/output/*.whl)
          if (( ${#repaired_wheels[@]} != 1 )); then
            echo "ERROR: expected one repaired wheel under ${BUILD_RUN_ROOT}/output, found ${#repaired_wheels[@]}." >&2
            exit 1
          fi

  hcu-unit-tests:
    name: Unit tests on HCU (DTK ${{ matrix.dtk_version }})
    needs: build-wheel
    runs-on: hygon-bw1100-1card
    timeout-minutes: 90
    container:
      image: ${{ format('{0}/hcu/base/dtk:{1}', vars.HARBOR_SITE, matrix.image_tag) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - dtk_id: dtk2604
            dtk_version: 2604
            python_version: "3.10"
            pytorch_das_force_reinstall: "true"
            image_tag: 26.04-rockylinux8.6-py3.10
            pytorch_index_suffix: nightly/dtk2604/+simple/
            pytorch_das_spec: torch==2.11.0
          - dtk_id: dtk2610
            dtk_version: 2610
            python_version: "3.12"
            pytorch_das_force_reinstall: "true"
            image_tag: 26.10-rockylinux8.6-py3.12
            pytorch_index_suffix: nightly/dtk2610/+simple/
            pytorch_das_spec: torch==2.13.0
          - dtk_id: dtk2704
            dtk_version: 2704
            python_version: "3.12"
            image_tag: 27.04-rockylinux8.6-py3.12
            pytorch_index_suffix: nightly/dtk2704
            pytorch_das_spec: torch==2.13.0
            pytorch_das_force_reinstall: "true"
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      PYTORCH_DAS_SPEC: ${{ matrix.pytorch_das_spec || vars.PYTORCH_DAS_SPEC || 'torch' }}
      PYTHON_BIN: python${{ matrix.python_version }}
      EXPECTED_PYTHON_VERSION: ${{ matrix.python_version }}
      BUILD_RUN_ROOT: /ci_public/hcu_probe-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/build/${{ matrix.dtk_id }}
      LOCAL_RUN_ROOT: /ci_public/hcu_probe-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk_id }}
      PYTORCH_INDEX_SUFFIX: ${{ matrix.pytorch_index_suffix }}
      PYTORCH_DAS_FORCE_REINSTALL: ${{ matrix.pytorch_das_force_reinstall }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          : "${PYPI_URL:?Repository variable PYPI_URL is required}"

          pypi_url="${PYPI_URL%/}"
          pytorch_das_index_url="${pypi_url}/${PYTORCH_INDEX_SUFFIX#/}"
          pypi_authority="${pypi_url#*://}"
          pypi_authority="${pypi_authority%%/*}"
          pytorch_das_trusted_host="${pypi_authority%%:*}"
          echo "::add-mask::${PYPI_URL}"
          echo "::add-mask::${pytorch_das_index_url}"
          echo "::add-mask::${pytorch_das_trusted_host}"
          if [[ "${PYTORCH_DAS_FORCE_REINSTALL}" == "true" ]]; then
            "${PYTHON_BIN}" -m pip install --disable-pip-version-check \
              --upgrade --force-reinstall \
              --index-url "${pytorch_das_index_url}" \
              --trusted-host "${pytorch_das_trusted_host}" \
              "${PYTORCH_DAS_SPEC}"
          fi

          shopt -s nullglob
          wheels=("${BUILD_RUN_ROOT}"/output/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "ERROR: expected one repaired wheel under ${BUILD_RUN_ROOT}/output, found ${#wheels[@]}." >&2
            exit 1
          fi

          export PYTORCH_DAS_INDEX_URL="${pytorch_das_index_url}"
          export PYTORCH_DAS_TRUSTED_HOST="${pytorch_das_trusted_host}"
          export PROJECT_WHEEL="${wheels[0]}"
          export CI_BUILD_WHEEL=0
          bash scripts/ci/run_hcu_ci.sh

      - name: Save reports to shared storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOCAL_RUN_ROOT}"
          if [[ -d "${GITHUB_WORKSPACE}/test/hcuprobe_test/report" ]]; then
            rm -rf -- "${LOCAL_RUN_ROOT}/report"
            cp -a --no-preserve=ownership \
              "${GITHUB_WORKSPACE}/test/hcuprobe_test/report" "${LOCAL_RUN_ROOT}/"
            echo "Reports saved to ${LOCAL_RUN_ROOT}"
          else
            echo "No test reports were produced."
          fi

      - name: Upload test and build reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hcu-probe-ci-${{ matrix.dtk_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/hcuprobe_test/report/
          if-no-files-found: warn
          retention-days: 14
